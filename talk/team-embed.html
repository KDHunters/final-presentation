<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>팀 슬라이드 (합본 안쪽 창)</title>
<style>html,body{margin:0;overflow:hidden;background:#000}</style>
</head>
<body>
<main id="stage" class="stage"></main>
<script type="module">
// 팀 덱의 슬라이드 조각(slides/*.html, order.json, common.css)을 그대로 읽어 한 장씩 보여 준다.
// 넘김·키 입력은 바깥 덱(deck.js)이 맡고, 이 창은 teamShow(경로, 단계)만 따른다. 팀 덱의 deck.js는 쓰지 않는다.
// 팀 덱 위치는 merge.json의 teamRoot(이 파일 기준 상대 경로). 저장소 안에서는 "../", 따로 받아 둔 사본이면 "seoyoung/".
const here = new URL('.', location.href), stage = document.getElementById('stage'), cache = new Map();
let root = here, order = [], cur = null, req = 0, dispose = null, silenced = false;
const load = async (path) => {
  if (!cache.has(path)) {
    const r = await fetch(new URL(path, root), {cache: 'no-cache'});
    if (!r.ok) throw new Error(path + ': HTTP ' + r.status);
    const t = document.createElement('template');
    t.innerHTML = (await r.text()).trim();
    cache.set(path, {section: t.content.firstElementChild, html: t.innerHTML});
  }
  return cache.get(path);
};
const stepsOf = ({section, html}) => {
  if (section.dataset.steps) return Number(section.dataset.steps) || 0;
  if (!('step' in section.dataset)) return 0;
  // data-steps 없이 data-step만 쓰는 장(4분할)은 스타일에 적힌 가장 큰 단계까지.
  return Math.max(0, ...[...html.matchAll(/\[data-step="(\d+)"\]/g)].map((m) => Number(m[1])));
};
window.teamReady = (async () => {
  const merge = await fetch(new URL('merge.json', here), {cache: 'no-cache'}).then((r) => (r.ok ? r.json() : {}), () => ({}));
  root = new URL(merge.teamRoot ?? 'seoyoung/', here);
  // 조각 안의 assets/… 경로와 common.css가 팀 덱 기준으로 풀리도록 기준 주소를 먼저 건다.
  const base = document.createElement('base'); base.href = root.href; document.head.append(base);
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = new URL('common.css', root).href;
  await new Promise((done) => { css.onload = css.onerror = done; document.head.append(css); });
  let paths = await (await fetch(new URL('order.json', root), {cache: 'no-cache'})).json();
  for (const x of merge.extra ?? []) {
    const name = x.path.split('/').pop();
    if (paths.some((p) => p.split('/').pop() === name)) continue; // 이미 팀 덱에 들어갔으면 넣지 않는다
    const at = paths.indexOf(x.after);
    paths.splice(at < 0 ? paths.length : at + 1, 0, new URL(x.path, here).href);
  }
  const from = merge.teamFrom ? paths.indexOf(merge.teamFrom) : 0;
  order = paths.slice(Math.max(0, from));
  // Reorder only the included team slides, without changing the standalone deck.
  for (const {path, before} of merge.teamMoves ?? []) {
    const at = order.indexOf(path);
    if (at < 0 || path === before || !order.includes(before)) continue;
    order.splice(at, 1);
    order.splice(order.indexOf(before), 0, path);
  }
  const metas = [];
  for (let i = 0; i < order.length; i++) {
    try { const c = await load(order[i]); metas.push({i, path: order[i], steps: stepsOf(c), dyn: !c.section.dataset.steps && 'step' in c.section.dataset, reset: c.section.dataset.stepEntry === 'reset'}); } catch (e) { console.warn(e); }
  }
  return metas;
})();
// 발표 창(관객용)에서는 소리를 내지 않는다. 소리는 발표자 창 한 곳에서만 난다(두 창에서 겹쳐 들리지 않게).
// 파형은 계속 움직이도록 소리 분석은 그대로 두고 스피커로 나가는 길만 0으로 줄인다.
const silence = () => {
  if (silenced) return; silenced = true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  class Quiet extends AC { get destination() { if (!this.__q) { const g = this.createGain(); g.gain.value = 0; g.connect(super.destination); this.__q = g; } return this.__q; } }
  window.AudioContext = Quiet; window.webkitAudioContext = Quiet;
};
// 쪽 번호: 팀 덱 common.css의 .slide-folio 스타일을 그대로 쓰고, 번호 글자만 바깥 덱이 합본 기준으로 준다. 제목 장에는 붙이지 않는다.
const folio = (section, text) => {
  if (!text || section.matches('.title-slide')) return;
  const f = document.createElement('footer');
  f.className = 'slide-folio'; f.setAttribute('aria-hidden', 'true'); f.textContent = text;
  section.append(f);
};
window.teamShow = async (path, step, opt = {}) => {
  await window.teamReady.catch(() => {});
  if (opt.silent) silence();
  if (path !== cur) {
    const id = ++req;
    cur = path; dispose?.(); dispose = null;
    const section = (await load(path)).section.cloneNode(true);
    let interview = null;
    if (section.querySelector('[data-interview-wave]')) interview = await import(new URL('assets/js/interview-wave.js', root));
    if (id !== req) return;
    if ('step' in section.dataset || section.dataset.steps) section.dataset.step = String(step);
    folio(section, opt.folio);
    if (opt.silent) {
      // 창을 한 번도 누르지 않았으면 브라우저가 소리 재생을 막으므로, 그때는 음소거로 틀어 자막만 맞춘다.
      const quiet = !(navigator.userActivation?.hasBeenActive ?? true);
      section.querySelectorAll('audio').forEach((a) => { a.muted = quiet; });
    }
    stage.replaceChildren(section);
    dispose = interview?.mountInterviewWave(section, root) ?? null;
  } else if (stage.firstElementChild) stage.firstElementChild.dataset.step = String(step);
};
// 지금 떠 있는 장에서 열려 있는 단계 수. 4분할 장은 영상 4개가 끝나야 3이 된다(팀 조각이 스스로 정한다).
window.teamLive = () => Number(stage.firstElementChild?.dataset.steps) || 0;
window.teamHide = () => { if (cur === null) return; cur = null; req++; dispose?.(); dispose = null; stage.replaceChildren(); };
</script>
</body>
</html>
