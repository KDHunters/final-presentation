<section class="slide s31-vision" aria-labelledby="s31-vision-title">
  <style>
    .stage:has(> .s31-vision) { position: fixed; inset: 0; overflow: hidden; background: var(--brown); }
    .stage > .s31-vision {
      --stage-scale: min(tan(atan2(100vw, 1920px)), tan(atan2(100dvh, 1080px)));
      position: absolute; top: 50%; left: 50%;
      display: flex; flex-direction: column; justify-content: center; gap: 0; width: 1920px; height: 1080px; min-block-size: 0;
      padding: 0 100px; overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--stage-scale));
      background: var(--brown); color: var(--text-light); word-break: keep-all;
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    }
    .s31-vision .eyebrow { margin: 0 0 8px; color: #D5BEA6; font: 500 34px/1.2 var(--font-family); letter-spacing: -.02em; }
    .s31-vision h2 { margin: 0; font: 700 68px/1.2 var(--font-family); letter-spacing: -.045em; }
    .s31-vision .cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 0 64px; height: 650px; margin-top: 36px; }
    .s31-vision .flow { display: grid; grid-template-rows: 1fr 56px 1fr 56px 1fr; min-height: 0; }
    .s31-vision .box { display: grid; align-content: center; gap: 10px; padding: 18px 40px; border: 2px solid #9A7B64; border-radius: 20px; background: #FFFFFF; color: var(--brown); }
    .s31-vision .box h3 { margin: 0; color: #846D5C; font: 700 34px/1.2 var(--font-family); letter-spacing: -.03em; }
    .s31-vision .box p { margin: 0; font: 500 38px/1.3 var(--font-family); letter-spacing: -.03em; }
    .s31-vision .arrow { display: grid; place-items: center; color: #D5BEA6; font: 500 48px/1 var(--font-family); }
    .s31-vision .market { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    .s31-vision .cand-head { margin: 0; padding-bottom: 12px; border-bottom: 3px solid #B99F85; color: #D5BEA6; font: 700 40px/1.2 var(--font-family); letter-spacing: -.03em; }
    .s31-vision .cands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, 128px); gap: 18px; align-content: start; margin: 20px 0 0; padding: 0; list-style: none; min-height: 0; }
    .s31-vision .cand { display: flex; align-items: center; justify-content: center; text-align: center; min-width: 0; padding: 0 28px; border: 1px solid rgba(242,228,201,.18); border-radius: 16px; background: rgba(242,228,201,.10); color: #F2E4C9; }
    .s31-vision .cand h3 { margin: 0; font: 700 39px/1.2 var(--font-family); letter-spacing: -.04em; white-space: nowrap; }
    @media screen and (prefers-reduced-motion: no-preference) {
      .s31-vision .cols { animation: s31-enter 320ms ease-out 120ms both; }
      @keyframes s31-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    }
  </style>
  <p class="eyebrow">확장</p>
  <h2 id="s31-vision-title">SaaS로 확장 가능한 픽셀 에셋 엔진</h2>
  <div class="cols">
    <div class="flow" aria-label="파이프라인 입력과 출력">
      <div class="box"><h3>입력</h3><p>반려동물 사진</p></div>
      <span class="arrow" aria-hidden="true">↓</span>
      <div class="box"><h3>파이프라인</h3><p>자동 생성과 품질 검증</p></div>
      <span class="arrow" aria-hidden="true">↓</span>
      <div class="box"><h3>출력</h3><p>32×32 픽셀 에셋</p></div>
    </div>
    <div class="market">
      <p class="cand-head">적용 분야</p>
      <ul class="cands" role="list">
        <li class="cand"><h3>게임 업계</h3></li>
        <li class="cand"><h3>이모티콘·스티커</h3></li>
        <li class="cand"><h3>브랜드 캐릭터</h3></li>
        <li class="cand"><h3>메타버스·아바타</h3></li>
        <li class="cand"><h3>반려동물 굿즈</h3></li>
        <li class="cand"><h3>앱 마스코트</h3></li>
      </ul>
    </div>
  </div>
</section>
