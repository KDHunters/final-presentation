<section class="slide s19-subscription-pricing" aria-label="스티키펫 구독 단가" data-steps="1" data-step="0">
  <style>
    .stage:has(> .s19-subscription-pricing) { position: fixed; inset: 0; overflow: hidden; background: #FAF7E9; }
    .stage > .s19-subscription-pricing {
      --stage-scale: min(tan(atan2(100vw, 1920px)), tan(atan2(100dvh, 1080px)));
      position: absolute; top: 50%; left: 50%;
      display: block; width: 1920px; height: 1080px; min-block-size: 0;
      padding: 56px 100px 0; overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--stage-scale));
      background: #FAF7E9; color: #392A20; word-break: keep-all;
    }
    .s19-subscription-pricing h2 { margin: 0; font: 700 68px/1.2 var(--font-family); letter-spacing: -.045em; }
    .s19-subscription-pricing .cols { display: grid; grid-template-columns: minmax(0, 940px) minmax(0, 1fr); column-gap: 40px; margin-top: 28px; }
    .s19-subscription-pricing .col { min-width: 0; color: #3D3326; letter-spacing: -.02em; }
    .s19-subscription-pricing .col--right { border-left: 3px solid #B99F85; padding-left: 40px; }
    .s19-subscription-pricing .head { margin: 0 0 6px; padding-bottom: 12px; border-bottom: 3px solid #B99F85; color: #846D5C; font: 700 48px/1.2 var(--font-family); }
    .s19-subscription-pricing .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 24px; align-items: center; min-height: 150px; border-bottom: 2px solid rgb(185 159 133 / .5); }
    .s19-subscription-pricing .item b { display: block; font: 700 52px/1.2 var(--font-family); letter-spacing: -.035em; }
    .s19-subscription-pricing .item span { display: block; margin-top: 6px; color: #9C8572; font: 500 34px/1.35 var(--font-family); }
    .s19-subscription-pricing .item em { font: 700 52px/1.1 var(--font-family); font-style: normal; letter-spacing: -.035em; white-space: nowrap; }
    .s19-subscription-pricing .sum { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 0 0; font: 700 52px/1.2 var(--font-family); letter-spacing: -.035em; }
    .s19-subscription-pricing .price { margin: 20px 0 8px; font: 700 150px/1.1 var(--font-family); letter-spacing: -.05em; }
    .s19-subscription-pricing .price mark { background: #FFE98A; color: #3D3326; padding: 0 4px; margin: 0; border-radius: 0; box-shadow: none; font: inherit; }
    .s19-subscription-pricing .incl { margin: 14px 0 0; padding: 0; list-style: none; }
    .s19-subscription-pricing .incl li { padding: 22px 0 22px 62px; position: relative; font: 700 52px/1.3 var(--font-family); letter-spacing: -.035em; }
    .s19-subscription-pricing .incl li::before { content: ""; position: absolute; left: 4px; top: 46px; width: 25px; height: 25px; background: #6DA351; }
    .s19-subscription-pricing[data-step="0"] .col--right > * { opacity: 0; transform: translateY(10px); }
    .s19-subscription-pricing[data-step="0"] .col--right > * { visibility: hidden; }
    @media screen and (prefers-reduced-motion: no-preference) {
      .s19-subscription-pricing .col--right > * { transition: opacity 320ms ease-out, transform 320ms ease-out, visibility 0s; }
      .s19-subscription-pricing[data-step="0"] .col--right > * { transition: opacity 0s, transform 0s, visibility 0s 320ms; }
      .s19-subscription-pricing .anim { animation: s19-enter 320ms ease-out 120ms both; }
      .stage[aria-busy="true"] > .s19-subscription-pricing .anim { animation-play-state: paused; }
      @keyframes s19-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    }
  </style>
  <h2>구독 비즈니스 모델</h2>
  <div class="cols anim">
    <div class="col">
      <p class="head">업계 평균 (월 구독료)</p>
      <div class="item"><div><b>펫 키우기 앱</b><span>Mooshi · Focus Friend · 할일차곡 · 루빗 · 하루콩</span></div><em>약 6,000원</em></div>
      <div class="item"><div><b>기기 간 동기화</b><span>메모위젯 · UpNote · Bear</span></div><em>약 4,300원</em></div>
      <div class="item"><div><b>AI 메모 정리</b><span>Cleft · Evernote Starter</span></div><em>약 10,200원</em></div>
      <div class="sum"><span>따로 쓰면</span><span>월 약 20,500원</span></div>
    </div>
    <div class="col col--right">
      <p class="head">스티키펫 플러스</p>
      <p class="price"><mark>월 5,900원</mark></p>
      <ul class="incl">
        <li>구독 전용 펫</li>
        <li>기기 간 동기화</li>
        <li>AI 기능 제공</li>
      </ul>
    </div>
  </div>
</section>
