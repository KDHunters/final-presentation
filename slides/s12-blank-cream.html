<section class="slide s11-feedback" aria-label="사용자 피드백 스크린샷" data-steps="5" data-step="0" data-step-entry="reset" data-step-click>
<style>
.stage:has(> .s11-feedback) {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--cream);
}
.stage > .s11-feedback {
  display: block;
  position: relative;
  width: min(100vw, calc(100dvh * 16 / 9));
  aspect-ratio: 16 / 9;
  min-block-size: 0;
  padding: 0;
  background: var(--cream);
}
/* Six excerpts on a proportional 1920 × 1080 canvas, with 12 px gutters. */
.s11-feedback > :is(img, svg) {
  position: absolute;
  inset-inline-start: var(--x);
  inset-block-start: var(--y);
  width: var(--w);
  height: auto;
}
.s11-feedback > :is(img:nth-of-type(1), svg[data-card="1"]) { --x: 1.562500%; --y: 5.275061%; --w: 48.596850%; }
.s11-feedback > :is(img:nth-of-type(2), svg[data-card="2"]) { --x: 50.784350%; --y: 5.275061%; --w: 47.653150%; }
.s11-feedback > :is(img:nth-of-type(3), svg[data-card="3"]) { --x: 1.562500%; --y: 34.064038%; --w: 96.875000%; }
.s11-feedback > :is(img:nth-of-type(4), svg[data-card="4"]) { --x: 1.562500%; --y: 15.025612%; --w: 48.596850%; }
.s11-feedback > :is(img:nth-of-type(5), svg[data-card="5"]) { --x: 1.562500%; --y: 55.113051%; --w: 96.875000%; }
.s11-feedback > :is(img:nth-of-type(6), svg[data-card="6"]) { --x: 1.562500%; --y: 75.818308%; --w: 96.875000%; }
/* Keep the excerpts and their matching highlight overlays above the folio on small canvases. */
@media (max-width: 560px), (max-height: 315px) {
  .s11-feedback > :is(img, svg) {
    inset-inline-start: calc(50% + (var(--x) - 50%) * .96);
    inset-block-start: calc(var(--y) * .96);
    width: calc(var(--w) * .96);
  }
}
/* Each mark shares the source image's coordinates; only the original glyph coverage is recolored. */
.s11-feedback > .s11-mark { display: block; visibility: hidden; pointer-events: none; }
.s11-feedback .s11-mark rect { fill: var(--highlight); }
.s11-feedback:not([data-step="0"]) > [data-mark="1"],
.s11-feedback:not([data-step="0"], [data-step="1"]) > [data-mark="2"],
.s11-feedback:not([data-step="0"], [data-step="1"], [data-step="2"]) > [data-mark="3"],
.s11-feedback:not([data-step="0"], [data-step="1"], [data-step="2"], [data-step="3"]) > [data-mark="4"],
.s11-feedback:not([data-step="0"], [data-step="1"], [data-step="2"], [data-step="3"], [data-step="4"]) > [data-mark="5"] { visibility: visible; }
</style>
