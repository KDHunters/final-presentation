<section class="slide s22-todo-extraction-flow" aria-labelledby="s22-title">
<style>
.stage:has(> .s22-todo-extraction-flow) { position: fixed; inset: 0; display: grid; place-items: center; background: var(--cream); }
.stage > .s22-todo-extraction-flow {
  display: block; width: min(100vw, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9;
  min-block-size: 0; padding: 0; overflow: hidden; container-type: inline-size;
  background: var(--cream); color: var(--brown);
}
.s22-todo-extraction-flow .wrap { padding: 2.2cqw 3.5cqw 0; }
.s22-todo-extraction-flow h2 { font: 700 3.2cqw/1.2 var(--font-family); letter-spacing: -.045em; margin: 0; }
.s22-todo-extraction-flow .flow {
  display: grid; grid-template-columns: 13cqw 1fr 1fr; column-gap: 2.4cqw;
  grid-template-rows: 7cqw 4cqw 7cqw 4cqw 10.5cqw 4cqw 7cqw; margin-top: 1.8cqw;
}
.s22-todo-extraction-flow .lab { display: flex; align-items: center; font: 700 2.4cqw/1.2 var(--font-family); letter-spacing: -.04em; color: #725D4E; border-right: .3cqw solid #BFB19F; padding-right: 1cqw; }
.s22-todo-extraction-flow .lab.llm { color: #4F763E; border-right-color: #4F763E; }
.s22-todo-extraction-flow .box { display: flex; align-items: center; justify-content: center; border-radius: 1cqw; border: .2cqw solid #BFB19F; background: #FBF7EF; font: 700 3cqw/1.2 var(--font-family); letter-spacing: -.04em; color: #392A20; }
.s22-todo-extraction-flow .box.rec { background: #EFE6D6; }
.s22-todo-extraction-flow .box.rec b { color: #4F763E; font-weight: 700; margin-right: 1.2cqw; }
.s22-todo-extraction-flow .box.llm { grid-column: 2 / 4; border-color: #4F763E; border-width: .3cqw; background: #F1F5EA; gap: 1.4cqw; padding: 0 2cqw; }
.s22-todo-extraction-flow .step { flex: 1; display: flex; align-items: center; justify-content: center; height: 6.2cqw; border-radius: .8cqw; background: #fff; border: .15cqw solid #B7C7A9; font: 700 2.4cqw/1.25 var(--font-family); letter-spacing: -.04em; text-align: center; padding: 0 1cqw; }
.s22-todo-extraction-flow .sep { width: 2.8cqw; height: 2.8cqw; flex: none; }
.s22-todo-extraction-flow .box.res { grid-column: 2 / 4; background: #4F763E; border-color: #4F763E; color: #fff; }
.s22-todo-extraction-flow .arr { display: flex; justify-content: center; align-items: stretch; }
.s22-todo-extraction-flow .arr svg { height: 100%; width: 3.6cqw; }
.s22-todo-extraction-flow .arr.wide { grid-column: 2 / 4; }
</style>
<div class="wrap">
  <h2 id="s22-title">할 일 추출 흐름</h2>
  <div class="flow">
    <div class="lab" style="grid-row:1">입력</div>
    <div class="box" style="grid-row:1;grid-column:2">음성</div>
    <div class="box" style="grid-row:1;grid-column:3">화면 캡처</div>

    <div class="arr" style="grid-row:2;grid-column:2"><svg viewBox="0 0 26 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8.5 0H17.5V23H8.5Z M0 21H26L13 40Z" fill="#392A20"/></svg></div>
    <div class="arr" style="grid-row:2;grid-column:3"><svg viewBox="0 0 26 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8.5 0H17.5V23H8.5Z M0 21H26L13 40Z" fill="#392A20"/></svg></div>

    <div class="lab" style="grid-row:3">인식</div>
    <div class="box rec" style="grid-row:3;grid-column:2">STT</div>
    <div class="box rec" style="grid-row:3;grid-column:3">OCR</div>

    <div class="arr" style="grid-row:4;grid-column:2"><svg viewBox="0 0 26 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8.5 0H17.5V23H8.5Z M0 21H26L13 40Z" fill="#392A20"/></svg></div>
    <div class="arr" style="grid-row:4;grid-column:3"><svg viewBox="0 0 26 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8.5 0H17.5V23H8.5Z M0 21H26L13 40Z" fill="#392A20"/></svg></div>

    <div class="lab llm" style="grid-row:5">LLM 할 일 추출</div>
    <div class="box llm" style="grid-row:5">
      <div class="step">내용 해석</div>
      <svg class="sep" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 0H8L18 10L8 20H2L12 10Z" fill="#4F763E"/></svg>
      <div class="step">할 일·날짜·시간 추출</div>
      <svg class="sep" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 0H8L18 10L8 20H2L12 10Z" fill="#4F763E"/></svg>
      <div class="step">타이틀 정리</div>
    </div>

    <div class="arr wide" style="grid-row:6"><svg viewBox="0 0 26 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8.5 0H17.5V23H8.5Z M0 21H26L13 40Z" fill="#392A20"/></svg></div>

    <div class="lab" style="grid-row:7">결과</div>
    <div class="box res" style="grid-row:7">할 일 텍스트</div>
  </div>
</div>
</section>
