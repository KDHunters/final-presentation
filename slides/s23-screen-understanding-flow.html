<section class="slide s23-screen-understanding-flow" aria-labelledby="s23-title">
<style>
.stage:has(> .s23-screen-understanding-flow) { position: fixed; inset: 0; display: grid; place-items: center; background: var(--cream); }
.stage > .s23-screen-understanding-flow {
  display: block; width: min(100vw, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9;
  min-block-size: 0; padding: 0; overflow: hidden; container-type: inline-size;
  background: var(--cream); color: var(--brown);
}
.s23-screen-understanding-flow .wrap { padding: 2.2cqw 3.5cqw 0; }
.s23-screen-understanding-flow h2 { font: 700 3.2cqw/1.2 var(--font-family); letter-spacing: -.045em; margin: 0; }
.s23-screen-understanding-flow .flow {
  display: grid; grid-template-columns: 13cqw 2.2fr 1fr; column-gap: 2.4cqw;
  grid-template-rows: 7cqw 3.6cqw 7cqw 3.6cqw 11.7cqw 3.6cqw 7cqw; margin-top: 1.8cqw;
}
.s23-screen-understanding-flow .lab { display: flex; align-items: center; font: 700 2.4cqw/1.2 var(--font-family); letter-spacing: -.04em; color: #725D4E; border-right: .3cqw solid #BFB19F; padding-right: 1cqw; }
.s23-screen-understanding-flow .box { display: flex; align-items: center; justify-content: center; border-radius: 1cqw; border: .2cqw solid #BFB19F; background: #FBF7EF; font: 700 3cqw/1.2 var(--font-family); letter-spacing: -.04em; color: #392A20; }
.s23-screen-understanding-flow .box.wide { grid-column: 2 / 4; gap: 1.6cqw; }
.s23-screen-understanding-flow .box small { font: 600 2cqw/1.2 var(--font-family); letter-spacing: -.04em; color: #725D4E; }
.s23-screen-understanding-flow .box.rec { background: #EFE6D6; }
.s23-screen-understanding-flow .box.judge { flex-direction: column; align-items: stretch; justify-content: center; gap: .8cqw; padding: 0 1.6cqw; }
.s23-screen-understanding-flow .box.judge.llm { border-color: #4F763E; border-width: .3cqw; background: #F1F5EA; }
.s23-screen-understanding-flow .when { display: flex; align-items: center; justify-content: space-between; font: 700 2.2cqw/1.2 var(--font-family); letter-spacing: -.04em; }
.s23-screen-understanding-flow .tag { border-radius: 99cqw; padding: .35cqw 1.1cqw; font: 700 1.6cqw/1.2 var(--font-family); letter-spacing: -.02em; background: #725D4E; color: #fff; white-space: nowrap; }
.s23-screen-understanding-flow .llm .tag { background: #4F763E; }
.s23-screen-understanding-flow .llm .when { color: #4F763E; }
.s23-screen-understanding-flow .steps { display: flex; align-items: center; gap: 1.2cqw; }
.s23-screen-understanding-flow .step { flex: 1; display: flex; align-items: center; justify-content: center; height: 6.2cqw; border-radius: .8cqw; background: #fff; border: .15cqw solid #BFB19F; font: 700 2.4cqw/1.25 var(--font-family); letter-spacing: -.04em; text-align: center; padding: 0 .6cqw; }
.s23-screen-understanding-flow .llm .step { border-color: #B7C7A9; }
.s23-screen-understanding-flow .sep { width: 2.6cqw; height: 2.6cqw; flex: none; }
.s23-screen-understanding-flow .box.res { background: #4F763E; border-color: #4F763E; color: #fff; }
.s23-screen-understanding-flow .arr { display: flex; justify-content: center; align-items: stretch; }
.s23-screen-understanding-flow .arr svg { height: 100%; width: 3.6cqw; }
</style>
<div class="wrap">
  <h2 id="s23-title">실시간 화면 이해 흐름</h2>
  <div class="flow">
    <div class="lab" style="grid-row:1">입력</div>
    <div class="box wide" style="grid-row:1">지금 보는 화면 <small>승차권 · 메일 · 카톡 대화</small></div>

    <div class="arr" style="grid-row:2;grid-column:2 / 4"><svg viewBox="0 0 26 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8.5 0H17.5V23H8.5Z M0 21H26L13 40Z" fill="#392A20"/></svg></div>

    <div class="lab" style="grid-row:3">인식</div>
    <div class="box wide rec" style="grid-row:3">접근성 API <small>화면 글자 읽기</small></div>

    <div class="arr" style="grid-row:4;grid-column:2"><svg viewBox="0 0 26 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8.5 0H17.5V23H8.5Z M0 21H26L13 40Z" fill="#392A20"/></svg></div>
    <div class="arr" style="grid-row:4;grid-column:3"><svg viewBox="0 0 26 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8.5 0H17.5V23H8.5Z M0 21H26L13 40Z" fill="#392A20"/></svg></div>

    <div class="lab" style="grid-row:5">판단</div>
    <div class="box judge llm" style="grid-row:5;grid-column:2">
      <div class="when">날짜·시각이 보이면 <span class="tag">LLM</span></div>
      <div class="steps">
        <div class="step">할 일 판정</div>
        <svg class="sep" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 0H8L18 10L8 20H2L12 10Z" fill="#4F763E"/></svg>
        <div class="step">일정 추출</div>
        <svg class="sep" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 0H8L18 10L8 20H2L12 10Z" fill="#4F763E"/></svg>
        <div class="step">중복 확인</div>
      </div>
    </div>
    <div class="box judge" style="grid-row:5;grid-column:3">
      <div class="when">질문이 보이면 <span class="tag">기기 안</span></div>
      <div class="steps"><div class="step">메모 검색</div></div>
    </div>

    <div class="arr" style="grid-row:6;grid-column:2"><svg viewBox="0 0 26 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8.5 0H17.5V23H8.5Z M0 21H26L13 40Z" fill="#392A20"/></svg></div>
    <div class="arr" style="grid-row:6;grid-column:3"><svg viewBox="0 0 26 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8.5 0H17.5V23H8.5Z M0 21H26L13 40Z" fill="#392A20"/></svg></div>

    <div class="lab" style="grid-row:7">결과</div>
    <div class="box res" style="grid-row:7;grid-column:2">일정 저장 제안</div>
    <div class="box res" style="grid-row:7;grid-column:3">메모 꺼내기</div>
  </div>
</div>
</section>
