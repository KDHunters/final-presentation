<section class="slide s16-blank-brown" aria-label="스티키펫 동작 갤러리" data-steps="1" data-step="0" data-step-entry="reset" data-step-click>
  <style>
    /* === FIXED 16:9 STAGE === */
    .stage:has(> .s16-blank-brown) {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #392A20;
    }

    .stage > .s16-blank-brown {
      --stage-scale: min(tan(atan2(100vw, 1920px)), tan(atan2(100dvh, 1080px)));
      position: absolute;
      top: 50%;
      left: 50%;
      display: grid;
      grid-template-columns: max-content;
      place-content: center;
      gap: 0;
      width: 1920px;
      height: 1080px;
      min-block-size: 0;
      padding: 0;
      overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--stage-scale));
      background: #392A20;
      color: #F2E4C9;
    }

    /* === MOTION GALLERY === */
    .s16-blank-brown .motion-grid {
      display: grid;
      grid-template-columns: repeat(3, 480px);
      gap: 32px 44px;
      /* Scale videos and captions together, preserving the center and the crop. */
      transform: scale(.90);
      transform-origin: center;
    }

    .s16-blank-brown .motion-tile {
      display: grid;
      gap: 12px;
      margin: 0;
      text-align: center;
    }

    .s16-blank-brown .motion-frame {
      position: relative;
      height: 426px;
      overflow: hidden;
      border-radius: 20px;
      background: #F6F4F0;
    }

    .s16-blank-brown .motion-frame > video {
      /* Mask only empty vertical margins. Keep the original pixel scale and matte. */
      position: absolute;
      top: -48px;
      left: 0;
      display: block;
      width: 480px;
      height: 520px;
      max-width: none;
      max-height: none;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .s16-blank-brown figcaption {
      font-size: 42px;
      font-weight: 500;
      line-height: 48px;
      letter-spacing: -.025em;
      white-space: nowrap;
    }

    /* === STEP 1: FULL-STAGE DIM AND BLUR === */
    .s16-blank-brown > .motion-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      visibility: hidden;
      pointer-events: none;
      background: rgb(0 0 0 / 0%);
      -webkit-backdrop-filter: blur(0px);
      backdrop-filter: blur(0px);
      /* Stay paintable during the exit, then hide the comparison from assistive tech. */
      transition: background-color 480ms ease-in-out,
                  -webkit-backdrop-filter 480ms ease-in-out,
                  backdrop-filter 480ms ease-in-out,
                  visibility 0s linear 480ms;
    }

    .s16-blank-brown[data-step="1"] > .motion-overlay {
      visibility: visible;
      background-color: rgb(0 0 0 / 55%);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      transition-delay: 0s;
    }

    .s16-blank-brown[data-step="1"] .motion-comparisons {
      opacity: 1;
      transition-duration: 365ms;
      transition-delay: 85ms;
    }

    @media (prefers-reduced-motion: reduce) {
      .s16-blank-brown > .motion-overlay,
      .s16-blank-brown .motion-comparisons {
        transition: none !important;
      }
    }

    /* === BEFORE / AFTER COMPARISONS === */
    .s16-blank-brown .motion-comparisons {
      display: grid;
      opacity: 0;
      transition: opacity 260ms ease-in-out;
      row-gap: 28px;
      font-size: 120px;
      line-height: 1.18;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.035em;
      color: #FFF5E1;
      text-shadow: 0 3px 18px rgb(0 0 0 / 50%);
    }

    .s16-blank-brown .motion-comparison {
      display: grid;
      grid-template-columns: 667px 160px 667px;
      align-items: baseline;
      white-space: nowrap;
    }

    .s16-blank-brown .motion-before { text-align: right; }
    .s16-blank-brown .motion-arrow {
      text-align: center;
      font-size: 88px;
    }
    .s16-blank-brown .motion-after {
      color: #FFE98A;
      font-size: 138px;
      font-weight: 700;
    }

    /* === DECK-GENERATED FOLIO === */
    .slide.s16-blank-brown > .slide-folio {
      --folio-ink: var(--text-light, #F2E4C9);
      font-size: max(21px, calc(8px / var(--stage-scale)));
      border-block-start-width: calc(1px / var(--stage-scale));
    }
  </style>

  <div class="motion-grid">
    <figure class="motion-tile">
      <div class="motion-frame"><video src="assets/s16-motion-grid/1-tail.mp4" muted autoplay loop playsinline disablepictureinpicture></video></div>
      <figcaption>제자리 꼬리 흔들기</figcaption>
    </figure>
    <figure class="motion-tile">
      <div class="motion-frame"><video src="assets/s16-motion-grid/2-walk.mp4" muted autoplay loop playsinline disablepictureinpicture></video></div>
      <figcaption>걷기</figcaption>
    </figure>
    <figure class="motion-tile">
      <div class="motion-frame"><video src="assets/s16-motion-grid/3-liedown.mp4" muted autoplay loop playsinline disablepictureinpicture></video></div>
      <figcaption>잠들기</figcaption>
    </figure>
    <figure class="motion-tile">
      <div class="motion-frame"><video src="assets/s16-motion-grid/3b-breathe.mp4" muted autoplay loop playsinline disablepictureinpicture></video></div>
      <figcaption>자며 숨쉬기</figcaption>
    </figure>
    <figure class="motion-tile">
      <div class="motion-frame"><video src="assets/s16-motion-grid/5-turn.mp4" muted autoplay loop playsinline disablepictureinpicture></video></div>
      <figcaption>돌아서기</figcaption>
    </figure>
    <figure class="motion-tile">
      <div class="motion-frame"><video src="assets/s16-motion-grid/4-struggle.mp4" muted autoplay loop playsinline disablepictureinpicture></video></div>
      <figcaption>버둥거리기</figcaption>
    </figure>
  </div>
  <div class="motion-overlay">
    <div class="motion-comparisons">
      <p class="motion-comparison"><span class="motion-before">50시간</span> <span class="motion-arrow">→</span> <strong class="motion-after">4분 20초</strong></p>
      <p class="motion-comparison"><span class="motion-before">20~25만원</span> <span class="motion-arrow">→</span> <strong class="motion-after">827원</strong></p>
    </div>
  </div>
</section>
