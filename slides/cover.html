<section class="slide slide--yard-green">
  <style>
    /* Sticky Pet web/style.css: final .yard.topdown background. */
    .stage:has(> .slide--yard-green) {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #739e5c;
    }

    .stage > .slide--yard-green {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 1920 / 1080;
      min-block-size: 0;
      padding: 0;
      transform: translate(-50%, -50%);
    }

    @supports (transform: scale(tan(atan2(1px, 1px)))) {
      .stage > .slide--yard-green {
        width: 1920px;
        height: 1080px;
        transform: translate(-50%, -50%)
          scale(min(tan(atan2(100vw, 1920px)), tan(atan2(100dvh, 1080px))));
      }
    }

    @media print {
      .stage > .slide--yard-green {
        position: static;
        width: 1920px;
        height: 1080px;
        background: #739e5c;
        transform: none;
        print-color-adjust: exact;
      }
    }
  </style>
</section>
