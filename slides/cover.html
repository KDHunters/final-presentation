<section class="slide slide--yard-green">
  <style>
    /* Sticky Pet web/style.css: .memo-board background. */
    .stage:has(> .slide--yard-green) {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #392a20;
    }

    .stage > .slide--yard-green {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 1920 / 1080;
      min-block-size: 0;
      padding: 0;
      transform: translate(-50%, -50%);
    }

    @supports (transform: scale(tan(atan2(1px, 1px)))) {
      .stage > .slide--yard-green {
        width: 1920px;
        height: 1080px;
        transform: translate(-50%, -50%)
          scale(min(tan(atan2(100vw, 1920px)), tan(atan2(100dvh, 1080px))));
      }
    }

    .stage > .slide--yard-green > .phone-frames {
      position: absolute;
      left: 49.6875%; /* Reference x = 636 of 1280. */
      top: 10.2777777778%; /* Reference y = 74, with 16:9 stage height extended to 720. */
      width: 44.84375%; /* Reference crop width = 574 of 1280. */
      height: auto;
      display: block;
      pointer-events: none;
    }

    @media print {
      .stage > .slide--yard-green {
        position: static;
        width: 1920px;
        height: 1080px;
        background: #392a20;
        transform: none;
        print-color-adjust: exact;
      }
    }
  </style>
  <img class="phone-frames" src="assets/phone-screens.webp" width="1148" height="1292" alt="왼쪽 휴대폰: 할 일 플로팅 메모. 오른쪽 휴대폰: 인절미가 있는 스티키펫 마당." draggable="false">
</section>
